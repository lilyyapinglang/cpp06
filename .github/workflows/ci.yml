name: C++ CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    # Pinning to ubuntu-24.04 to avoid the unreleased ubuntu-latest migration warning
    runs-on: ubuntu-24.04

    steps:
    # Upgraded checkout action to v4 with explicit node setup if needed, but v4 is safe.
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3

    - name: Compile and Test Exercises
      run: |
        EXERCISES=("ex00" "ex01" "ex02")
        
        for ex in "${EXERCISES[@]}"; do
          if [ -d "$ex" ]; then
            echo "========================================"
            echo "Starting: $ex"
            echo "========================================"
            cd "$ex"
            
            # Clean previous builds safely
            if grep -q "fclean" Makefile 2>/dev/null; then
              make fclean
            else
              make clean || true
            fi
            
            # Compile and catch compilation failure
            echo "Compiling $ex..."
            if ! make; then
              echo "❌ ERROR: Compilation failed in $ex"
              exit 1
            fi
            
            # Run test script if it exists and catch test failure
            if [ -f "test.py" ]; then
              echo "Running tests for $ex..."
              if ! python3 test.py; then
                echo "❌ ERROR: test.py failed in $ex"
                exit 1
              fi
            else
              echo "No test.py found for $ex, skipping."
            fi
            
            cd ..
          else
            echo "Directory $ex not found, skipping."
          fi
        done
        echo "✅ All exercises compiled and passed successfully!"
