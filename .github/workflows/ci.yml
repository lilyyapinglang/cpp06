name: C++ CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Install compiler and tools
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3

    # Step 3: Build and test each exercise directory
    - name: Compile and Test Exercises
      run: |
        # Define the exercise directories to test
        EXERCISES=("ex00" "ex01" "ex02")
        
        for ex in "${EXERCISES[@]}"; do
          if [ -d "$ex" ]; then
            echo "========================================"
            echo "Processing $ex..."
            echo "========================================"
            cd "$ex"
            
            # 1. Clean previous build files if any exist
            if grep -q "fclean" Makefile 2>/dev/null; then
              make fclean
            else
              make clean || true
            fi
            
            # 2. Compile the project
            echo "Compiling..."
            make
            
            # 3. Run Python test script if it exists
            if [ -f "test.py" ]; then
              echo "Running tests..."
              python3 test.py
            else
              echo "No test.py found for $ex, skipping tests."
            fi
            
            # Go back to the root directory before the next iteration
            cd ..
          else
            echo "Directory $ex not found, skipping."
          fi
        done
